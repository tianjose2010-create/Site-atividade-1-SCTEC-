<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <title>Salas</title>
  </head>
  <body>
    <header>
      <h1>Salas</h1>

      <nav>
        <!-- Seção de navegação do site.-->
        <ul>
          <!-- Lista não ordenada para links do nosso menu-->
          <li><a href="#sobre">Sobre mim</a></li>
          <li><a href="#projeto">Projetos</a></li>
          <li><a href="#contato">Contatos</a></li>
          <li><a href="https://www.google.com/?hl=es" target="_blank">Google</a></li>
          <!-- <li>Sobre mim</li> -->
        </ul>
      </nav>
    </header>

    <section id="sobre">
        <h2>Sobre mim</h2>

        <img src="perro.jpg" alt="Imagem de perfil" title="Imagem de perfil">

        <article>
            <p>
                Olá! Eu sou Salas
            </p>

        </article>

        <aside>
             <h3>Habilidades</h3>

          <ul>HTML</ul>
          <ul>CSS</ul>
          <ul>JavaScript</ul>
          
        </aside>

    </section>

    <section id="projeto">

      <h2>Projetos</h2>

      <article>
        <h3>Portfólio</h3>

        <p>
          Este foi o primeiro site que desenvolvi estudando front-end.
        </p>
      </article>     
    </section>
    <footer>
      <p>Direitos reservados a Salas</p>

      <section id="contato">
        <h2>Contatos</h2>

        <p>Tem um projeto em mente? Entre em contato.</p>

        <form action="">

          <label for="nome">Nome: </label>
          <input type="text" id="nome" name="nome" required> <br>

          <label for="email">Email: </label>
          <input type="email" id="email" name="email" required> <br>

          <label for="telefone">Telefone: </label>
          <input type="tel" id="telefone" name="telefone" required> <br>

          <label for="assunto">Assunto: </label>
          <select name="assunto" id="assunto">
              <option value="orcamento">Orçamento</option>
              <option value="duvida">Dúvida</option>
              <option value="outro">Outro</option>
          </select>

          <br>

          <label for="mensagem">Mensagem: </label>
          <textarea name="mensagem" id="mensagem" cols="20" rows="5" required></textarea>

          <input type="checkbox" id="inscricao" name="inscricao">
          <label for="inscricao">Deseja receber minha newsletter? Fique por dentro</label>

          <br>

          <input type="submit" value="Enviar mensagem">
                  
        </form>
        
      </section>
  </body>
</html>
